<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Kho Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #090d16;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 36px 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            color: #f8fafc;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        p.sub {
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        input[type="password"], textarea {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus, textarea:focus {
            border-color: #38bdf8;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            border: none;
            color: #ffffff;
            padding: 15px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .status-msg {
            margin-top: 18px;
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .home-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>QUẢN LÝ KHO KEY</h2>
        <p class="sub">Trang nhập danh sách Key dành cho Admin</p>

        <div class="form-group">
            <label>Mật Khẩu Quản Lý</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu admin...">
        </div>

        <div class="form-group">
            <label>Danh Sách Key (Phân cách bằng dấu |)</label>
            <textarea id="keys" placeholder="bach21122011|bachdeptrai"></textarea>
        </div>

        <button class="btn-submit" onclick="addKeys()">
            LƯU VÀO KHO KEY
        </button>

        <div id="status" class="status-msg" style="display: none;"></div>

        <a href="/" class="home-link"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a>
    </div>

    <script>
        async function addKeys() {
            const password = document.getElementById('password').value.trim();
            const keys = document.getElementById('keys').value.trim();
            const statusDiv = document.getElementById('status');

            if (!password || !keys) {
                statusDiv.style.display = 'flex';
                statusDiv.style.color = '#fbbf24';
                statusDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Vui lòng nhập đầy đủ Mật khẩu và Key!';
                return;
            }

            statusDiv.style.display = 'flex';
            statusDiv.style.color = '#38bdf8';
            statusDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu vào kho...';

            try {
                const res = await fetch('/api/admin/add-keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, keys })
                });

                const data = await res.json();

                statusDiv.style.display = 'flex';
                if (data.success) {
                    statusDiv.style.color = '#4ade80';
                    statusDiv.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${data.message}`;
                    document.getElementById('keys').value = ''; // Làm sạch ô nhập Key
                } else {
                    statusDiv.style.color = '#f87171';
                    statusDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${data.message}`;
                }
            } catch (err) {
                statusDiv.style.display = 'flex';
                statusDiv.style.color = '#f87171';
                statusDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Lỗi kết nối Server!';
            }
        }
    </script>
</body>
</html>
