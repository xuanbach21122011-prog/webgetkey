<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lấy Key Tự Động</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #090d16;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        /* Nút Admin ở góc trên bên phải */
        .admin-nav-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .admin-nav-btn:hover {
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(30, 41, 59, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
        }

        .card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            color: #38bdf8;
            font-size: 1.5rem;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 10px;
        }

        p.desc {
            font-size: 0.875rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            border: none;
            color: #ffffff;
            padding: 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(79, 70, 229, 0.45);
        }

        .status-msg {
            margin-top: 20px;
            font-size: 0.825rem;
            color: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- Nút Admin -->
    <a href="/admin.html" class="admin-nav-btn">
        <i class="fa-solid fa-user-gear"></i> Admin
    </a>

    <div class="card">
        <div class="icon-box">
            <i class="fa-solid fa-key"></i>
        </div>
        
        <div class="badge">
            <span class="badge-dot"></span>
            Hệ Thống Tự Động 2 Chặng
        </div>

        <h1>Lấy Key Truy Cập</h1>
        <p class="desc">Vui lòng vượt qua 2 chặng link Link4M để hệ thống tự động cấp Key từ kho cho bạn.</p>

        <button class="btn-submit" onclick="startStep1()">
            BẮT ĐẦU VƯỢT LINK
        </button>

        <div id="status" class="status-msg" style="display: none;"></div>
    </div>

    <script>
        async function startStep1() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'flex';
            statusDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang khởi tạo link Chặng 1...';
            
            try {
                const res = await fetch('/api/step1');
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.url;
                } else {
                    statusDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${data.message}`;
                }
            } catch (err) {
                statusDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Lỗi kết nối Server!';
            }
        }
    </script>
</body>
</html>
