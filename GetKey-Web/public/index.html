<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lấy Key</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        /* Nút Admin ở góc trên bên phải */
        .admin-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #ff9800;
            color: #fff;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .admin-btn:hover {
            background-color: #e68a00;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        button.action-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        button.action-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- NÚT CHUYỂN SANG TRANG ADMIN -->
    <a href="/admin.html" class="admin-btn">⚙️ Admin Log</a>

    <div class="card">
        <h2>Hệ Thống Lấy Key Auto</h2>
        <p>Bấm nút bên dưới để bắt đầu vượt link lấy Key</p>
        <button class="action-btn" onclick="startStep1()">Lấy Key Ngay</button>
    </div>

    <script>
        async function startStep1() {
            const res = await fetch('/api/step1');
            const data = await res.json();
            if (data.success) {
                window.location.href = data.url;
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
